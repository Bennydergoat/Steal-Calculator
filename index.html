<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore Steal Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #0f172a, #020617);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* Animated background glow - Fixed for no edges */
body::before {
    content: "";
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(56,189,248,0) 70%);
    border-radius: 50%;
    top: -200px;
    left: -200px;
    animation: float 8s infinite ease-in-out;
    pointer-events: none;
    z-index: -1;
}

@keyframes float {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(40px, 40px); }
}

/* Glass card */
.card {
    backdrop-filter: blur(20px);
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
    padding: 35px 30px;
    border-radius: 24px;
    width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 10;
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 28px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

label {
    font-size: 14px;
    font-weight: 600;
    color: #cbd5e1;
    margin-left: 4px;
    display: block;
}

select {
    width: 100%;
    padding: 14px 16px;
    margin: 8px 0 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background-color: rgba(2, 6, 23, 0.6);
    color: white;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2394a3b8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1em;
}

select:hover { background-color: rgba(2, 6, 23, 0.8); border-color: rgba(255, 255, 255, 0.2); }
select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }

.mutations {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 8px;
    margin-bottom: 24px;
}

.mutation-btn {
    position: relative;
    height: 48px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid transparent;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

.mutation-btn:hover { transform: translateY(-2px) scale(1.05); }

.normal { background: #334155; color: #f8fafc; }
.gold { background: linear-gradient(135deg, #facc15, #eab308); color: #422006; }
.diamond { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #f0f9ff; }
.diamond::after {
    content: ""; position: absolute; top: -50%; left: -80%; width: 50%; height: 200%;
    background: rgba(255,255,255,0.4); transform: rotate(25deg); animation: shine 3s infinite;
}

@keyframes shine { 0%, 20% { left: -80%; } 100% { left: 150%; } }

.rainbow {
    background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    animation: rainbowBorder 3s linear infinite;
}

@keyframes rainbowBorder { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

.active { border: 2px solid white; transform: scale(1.05); }

.result {
    background: linear-gradient(180deg, rgba(2,6,23,0.7), rgba(2,6,23,0.9));
    padding: 24px 20px;
    border-radius: 16px;
    text-align: center;
    margin-top: 15px;
    border: 1px solid rgba(255,255,255,0.03);
}

.price {
    font-size: 42px;
    color: #22c55e;
    font-weight: 800;
    text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
}

.meta { font-size: 14px; color: #94a3b8; margin-top: 8px; }

.pulse { animation: pulseAnim 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes pulseAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); color: #4ade80; }
    100% { transform: scale(1); }
}

/* --- NEW LINK BUTTONS --- */
.external-links {
    position: fixed;
    bottom: 30px;
    left: 30px;
    display: flex;
    gap: 15px;
    z-index: 100;
}

.icon-btn {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

.icon-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
    transition: transform 0.3s ease;
}

.icon-btn:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: rgba(56, 189, 248, 0.5);
    transform: translateY(-8px) scale(1.1);
    color: #38bdf8;
    box-shadow: 0 15px 30px rgba(56, 189, 248, 0.2);
}

.icon-btn:hover svg {
    transform: rotate(8deg);
}

/* Tooltip */
.icon-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #0f172a;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.1);
}

.icon-btn:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div class="card">
    <h1>💎 Steal Calculator</h1>

    <label>Ore Tier</label>
    <select id="rarity" onchange="calc()">
        <option value="19">Common</option>
        <option value="49">Rare</option>
        <option value="79">Epic</option>
        <option value="199">Legendary</option>
        <option value="349">Mythic</option>
        <option value="599">Secret</option>
        <option value="999">Divine</option>
    </select>

    <label>Mutation</label>
    <div class="mutations">
        <div class="mutation-btn normal active" onclick="setMutation(1,this)">Normal</div>
        <div class="mutation-btn gold" onclick="setMutation(1.25,this)">Gold</div>
        <div class="mutation-btn diamond" onclick="setMutation(1.5,this)">Diamond</div>
        <div class="mutation-btn rainbow" onclick="setMutation(1.75,this)">Rainbow</div>
    </div>

    <label>Merge Tier</label>
    <select id="merge" onchange="calc()">
        <option value="1">Base</option>
        <option value="1.25">Shiny</option>
        <option value="1.5">Polished</option>
        <option value="1.75">Refined</option>
        <option value="2.25">Enhanced</option>
        <option value="2.75">Elite</option>
        <option value="3.25">Ascended</option>
        <option value="4.25">Prime</option>
        <option value="5.25">Apex</option>
        <option value="6.25">Omega</option>
    </select>

    <div class="result">
        <div class="price" id="price">--</div>
        <div class="meta" id="details"></div>
    </div>
</div>

<div class="external-links">
    <a href="https://github.com/Bennydergoat/Steal-Calculator" target="_blank" class="icon-btn" data-tooltip="GitHub Project">
        <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    </a>
    <a href="https://docs.google.com/document/d/1DutoU5qzktEiR_c0AFh-7gQEaOvvMqO4kkSMCqNkr7w/edit?usp=sharing" target="_blank" class="icon-btn" data-tooltip="Documentation">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    </a>
</div>

<script>
let mutation = 1;

function setMutation(val, el) {
    mutation = val;
    document.querySelectorAll(".mutation-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    calc();
}

function animatePrice(newValue) {
    let el = document.getElementById("price");
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
    el.innerText = newValue;
}

function calc() {
    let base = parseFloat(document.getElementById("rarity").value);
    let merge = parseFloat(document.getElementById("merge").value);
    let total = mutation * merge;
    let price = Math.round(base * total);

    animatePrice(price.toLocaleString() + " Robux");

    document.getElementById("details").innerText =
        "Total Multiplier: " + total.toFixed(2) + "x";
}

calc();
</script>

</body>
</html>
