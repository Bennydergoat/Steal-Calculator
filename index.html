<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore Steal Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #0f172a, #020617);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* Animated background glow - Fixed for no edges */
body::before {
    content: "";
    position: absolute;
    width: 800px; /* Made slightly larger for a smoother fade */
    height: 800px;
    /* Gradient now hits transparent at 70% to ensure edges are invisible */
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(56,189,248,0) 70%);
    border-radius: 50%; /* This turns the 'square' into a circle */
    top: -200px;
    left: -200px;
    animation: float 8s infinite ease-in-out;
    pointer-events: none;
    z-index: -1;
}

@keyframes float {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(40px, 40px); }
}

/* Glass card */
.card {
    backdrop-filter: blur(20px);
    background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
    padding: 35px 30px;
    border-radius: 24px;
    width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

/* Title */
h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 28px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* Inputs */
label {
    font-size: 14px;
    font-weight: 600;
    color: #cbd5e1;
    margin-left: 4px;
    display: block;
}

/* Improved Dropdowns */
select {
    width: 100%;
    padding: 14px 16px;
    margin: 8px 0 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background-color: rgba(2, 6, 23, 0.6);
    color: white;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    /* Custom Dropdown Arrow */
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2394a3b8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1em;
}

select:hover {
    background-color: rgba(2, 6, 23, 0.8);
    border-color: rgba(255, 255, 255, 0.2);
}

select:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
}

select option {
    background: #0f172a;
    color: white;
    padding: 10px;
}

/* Mutation buttons */
.mutations {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 8px;
    margin-bottom: 24px;
}

.mutation-btn {
    position: relative;
    height: 48px; /* Fixed height */
    border-radius: 12px;
    cursor: pointer;
    /* Flexbox applied for perfect horizontal and vertical centering */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    border: 2px solid transparent;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

/* Hover animation */
.mutation-btn:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
}

/* Normal */
.normal { 
    background: #334155; 
    color: #f8fafc;
}

/* Gold */
.gold {
    background: linear-gradient(135deg, #facc15, #eab308);
    color: #422006;
    box-shadow: 0 0 12px rgba(250,204,21,0.4);
}

/* Diamond */
.diamond {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #f0f9ff;
}

.diamond::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -80%;
    width: 50%;
    height: 200%;
    background: rgba(255,255,255,0.4);
    transform: rotate(25deg);
    animation: shine 3s infinite;
}

@keyframes shine {
    0%, 20% { left: -80%; }
    100% { left: 150%; }
}

/* Rainbow */
.rainbow {
    background: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7);
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    animation: rainbowBorder 3s linear infinite;
}

@keyframes rainbowBorder {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

/* Active */
.active {
    border: 2px solid white;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
}
.active:hover {
    transform: translateY(-2px) scale(1.05); /* Match hover to prevent jitter */
}

/* Result box */
.result {
    background: linear-gradient(180deg, rgba(2,6,23,0.7), rgba(2,6,23,0.9));
    padding: 24px 20px;
    border-radius: 16px;
    text-align: center;
    margin-top: 15px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.03);
}

.price {
    font-size: 42px;
    color: #22c55e;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    transition: color 0.3s;
}

.meta {
    font-size: 14px;
    font-weight: 500;
    color: #94a3b8;
    margin-top: 8px;
}

/* Pulse animation when updated */
.pulse {
    animation: pulseAnim 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes pulseAnim {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); color: #4ade80; text-shadow: 0 0 30px rgba(74, 222, 128, 0.6);}
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card">
    <h1>💎 Steal Calculator</h1>

    <label>Ore Tier</label>
    <select id="rarity" onchange="calc()">
        <option value="19">Common</option>
        <option value="49">Rare</option>
        <option value="79">Epic</option>
        <option value="199">Legendary</option>
        <option value="349">Mythic</option>
        <option value="599">Secret</option>
        <option value="999">Divine</option>
    </select>

    <label>Mutation</label>
    <div class="mutations">
        <div class="mutation-btn normal active" onclick="setMutation(1,this)">Normal</div>
        <div class="mutation-btn gold" onclick="setMutation(1.25,this)">Gold</div>
        <div class="mutation-btn diamond" onclick="setMutation(1.5,this)">Diamond</div>
        <div class="mutation-btn rainbow" onclick="setMutation(1.75,this)">Rainbow</div>
    </div>

    <label>Merge Tier</label>
    <select id="merge" onchange="calc()">
        <option value="1">Base</option>
        <option value="1.25">Shiny</option>
        <option value="1.5">Polished</option>
        <option value="1.75">Refined</option>
        <option value="2.25">Enhanced</option>
        <option value="2.75">Elite</option>
        <option value="3.25">Ascended</option>
        <option value="4.25">Prime</option>
        <option value="5.25">Apex</option>
        <option value="6.25">Omega</option>
    </select>

    <div class="result">
        <div class="price" id="price">--</div>
        <div class="meta" id="details"></div>
    </div>
</div>

<script>
let mutation = 1;

function setMutation(val, el) {
    mutation = val;
    document.querySelectorAll(".mutation-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    calc();
}

function animatePrice(newValue) {
    let el = document.getElementById("price");
    // Trigger reflow to restart animation
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
    el.innerText = newValue;
}

function calc() {
    let base = parseFloat(document.getElementById("rarity").value);
    let merge = parseFloat(document.getElementById("merge").value);

    let total = mutation * merge;
    let price = Math.round(base * total);

    animatePrice(price.toLocaleString() + " Robux");

    document.getElementById("details").innerText =
        "Total Multiplier: " + total.toFixed(2) + "x";
}

// Initial calculation
calc();
</script>

</body>
</html>
